# ============================================================================
# Fly.io - admin panel (Next.js standalone, alohida app).
# Panel /api/* so'rovlarini next.config.mjs'da yozilgan API manziliga proksi qiladi
# (build-time rewrite); shuning uchun brauzer CORS'ini sozlash shart emas,
# cookie'lar same-origin yuboriladi.
#
#   fly apps create moyskladoy-admin
#   fly deploy --config fly.admin.toml
# ============================================================================
app = "moyskladoy-admin"
primary_region = "sin"

[build]
dockerfile = "apps/admin/Dockerfile"

# API manzili next.config.mjs'da build vaqtida yoziladi (standart: https://moyskladoy.fly.dev).
# Fly runtime [env] orqali bu rewrite manzilini o'zgartirib bo'lmaydi.

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
